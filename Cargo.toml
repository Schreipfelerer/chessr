[package]
name = "chessr"
version = "0.1.0"
edition = "2024"
default-run = "chessr"

[dependencies]
arrayvec = "0.7.8"
bytemuck = { version = "1.25.2", features = ["derive"] }

[build-dependencies]
bytemuck = "1.25.2"
rand = "0.10.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "unwind"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
inline_always = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
