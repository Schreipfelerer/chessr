[package]
name = "chessr"
version = "0.1.0"
edition = "2024"
default-run = "chessr"

[dependencies]
arrayvec = "0.7.8"
bytemuck = { version = "1.25.2", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking"] }

[build-dependencies]
bytemuck = "1.25.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "unwind"
